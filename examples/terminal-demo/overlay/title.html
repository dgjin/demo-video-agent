<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Terminal Demo</title>
<style>
  :root { --delta: 0s; --bg: #05070b; --fg: #e6ecf7; --dim: #7c8aa0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 50% 18%, #101826 0%, var(--bg) 64%);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
  }
  .anim { opacity: 0; transform: translateY(18px); }
  body.playing .anim {
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
    animation-delay: calc(var(--d, 0s) - var(--delta));
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .badge {
    font: 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 6px; color: #4ade80;
    border: 1px solid rgba(74, 222, 128, .32); border-radius: 999px;
    padding: 10px 26px; background: rgba(74, 222, 128, .07);
  }
  h1 {
    font-size: 96px; letter-spacing: 6px;
    background: linear-gradient(90deg, #e5e7eb, #86efac, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { font-size: 32px; letter-spacing: 6px; color: var(--dim); }
  .hint { margin-top: 14px; font: 20px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; color: var(--dim); }
  #veil {
    position: fixed; inset: 0; background: var(--bg); z-index: 99;
    pointer-events: none; opacity: 1; transition: opacity 1s ease 1s;
  }
  body.playing #veil { opacity: 0; }
  .dv-cursor { display: none !important; }
</style>
</head>
<body>
  <div class="stage">
    <div class="badge anim" style="--d:.4s">TERMINAL SCENE</div>
    <h1 class="anim" style="--d:1.0s">终端幕示例</h1>
    <p class="lead anim" style="--d:1.8s">asciinema 录制 · 一键回放成画面</p>
    <p class="hint anim" style="--d:2.8s">terminal: 'assets/demo.cast'</p>
  </div>
  <div id="veil"></div>
</body>
</html>
